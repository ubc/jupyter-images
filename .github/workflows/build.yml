name: Build and Push Docker Images to ECR

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to fetch full history for diff

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, create ECR repo if needed, and push Docker images
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          # Read-only deploy key for kevinlb1/CodingWorkspace (private), used
          # only by the codingworkspace-notebook build. Absent on fork PRs.
          CW_DEPLOY_KEY: ${{ secrets.CW_DEPLOY_KEY }}
        run: |
          # Determine the base commit for the changed-files diff.
          # github.event.before is the null SHA on a new branch's first push
          # (and empty for pull_request events), which makes `git diff` abort
          # with "fatal: bad object". Fall back to the merge-base with the
          # default branch, then to the commit's first parent, so detection
          # works for new branches, PRs, and normal pushes alike.
          BEFORE="${{ github.event.before }}"
          echo "Reported previous SHA: ${BEFORE:-<none>}"
          echo "Current SHA: ${{ github.sha }}"

          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || true)
            if [ -z "$BASE" ]; then
              BASE=$(git rev-parse --verify --quiet "${{ github.sha }}^" || true)
            fi
          else
            BASE="$BEFORE"
          fi

          # Get changed files between the resolved base and the current commit.
          if [ -n "$BASE" ]; then
            echo "Diffing against base: $BASE"
            changed_files=$(git diff --name-only "$BASE" "${{ github.sha }}")
          else
            # Root commit with no parent: treat every tracked file as changed.
            echo "No diff base found; treating all tracked files as changed."
            changed_files=$(git ls-tree -r --name-only "${{ github.sha }}")
          fi

          echo "Changed files:"
          echo "$changed_files"

          for dir in */ ; do
            dir=${dir%/}
            # Check if any changed files in this directory
            if echo "$changed_files" | grep -q "^$dir/"; then
              echo "Detected changes in $dir - processing..."

              IMAGE_NAME="$dir"
              ECR_REPO="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME"

              # Check if ECR repo exists, create if not
              if ! aws ecr describe-repositories --repository-names "$IMAGE_NAME" > /dev/null 2>&1; then
                echo "ECR repository $IMAGE_NAME does not exist. Creating..."
                aws ecr create-repository --repository-name "$IMAGE_NAME" > /dev/null || true
              else
                echo "ECR repository $IMAGE_NAME already exists."
              fi

              # Build and push image
              TAG="${GITHUB_SHA::7}"
              EXTRA_BUILD_ARGS=()

              # codingworkspace-notebook installs CodingWorkspace from source,
              # and that repo (kevinlb1/CodingWorkspace) is private: clone it
              # with the read-only CW_DEPLOY_KEY deploy key at the ref pinned
              # in codingworkspace-notebook/CW_REF, and hand it to the build as
              # the `cwsrc` named context the image's Dockerfile expects. The
              # clone lives in RUNNER_TEMP so it never leaks into the default
              # build context of the other images. Skipped (not failed) when
              # the secret is unavailable, e.g. on pull requests from forks.
              if [ "$dir" = "codingworkspace-notebook" ]; then
                if [ -z "${CW_DEPLOY_KEY:-}" ]; then
                  echo "CW_DEPLOY_KEY secret unavailable (fork PR?); skipping $dir."
                  continue
                fi
                CW_REF=$(grep -Ev '^[[:space:]]*(#|$)' "$dir/CW_REF" | head -n1 | tr -d '[:space:]')
                if [ -z "$CW_REF" ]; then
                  echo "ERROR: $dir/CW_REF contains no ref." >&2
                  exit 1
                fi
                echo "Cloning CodingWorkspace at pinned ref: $CW_REF"
                keyfile="$RUNNER_TEMP/cw_deploy_key"
                printf '%s\n' "$CW_DEPLOY_KEY" > "$keyfile"
                chmod 600 "$keyfile"
                rm -rf "$RUNNER_TEMP/cw-src"
                GIT_SSH_COMMAND="ssh -i $keyfile -o StrictHostKeyChecking=accept-new" \
                  git clone --quiet git@github.com:kevinlb1/CodingWorkspace.git "$RUNNER_TEMP/cw-src"
                rm -f "$keyfile"
                # A SHA resolves directly; a branch name needs the origin/ prefix.
                git -C "$RUNNER_TEMP/cw-src" checkout --quiet --detach "$CW_REF" 2>/dev/null \
                  || git -C "$RUNNER_TEMP/cw-src" checkout --quiet --detach "origin/$CW_REF"
                CW_SHA=$(git -C "$RUNNER_TEMP/cw-src" rev-parse --short=7 HEAD)
                TAG="${TAG}-cw${CW_SHA}"
                EXTRA_BUILD_ARGS+=(--build-context "cwsrc=$RUNNER_TEMP/cw-src")
              fi

              docker buildx build --load "${EXTRA_BUILD_ARGS[@]}" -f "$dir/Dockerfile" -t "$ECR_REPO:$TAG" .
              docker push "$ECR_REPO:$TAG"
              docker tag "$ECR_REPO:$TAG" "$ECR_REPO:latest"
              docker push "$ECR_REPO:latest"
            else
              echo "No changes in $dir, skipping build."
            fi
          done
