name: Validate and publish Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Build, scan, and publish immutable images from main
        required: true
        type: boolean
        default: false
      scope:
        description: Images to build (the tracker selects codingworkspace-notebook)
        required: true
        type: choice
        options:
          - changed
          - codingworkspace-notebook
          - all
        default: changed
      promote_codingworkspace:
        description: Move codingworkspace-notebook preview/latest after an approved CW release
        required: true
        type: boolean
        default: false
      codingworkspace_candidate_sha:
        description: Optional full lowercase CW SHA for a non-promoting candidate build
        required: false
        type: string
        default: ""

# Fork pull requests run only non-secret selection/validation. AWS OIDC is
# never requested for a pull request. Ordinary images retain their existing
# branch/tag publication behavior; the private CodingWorkspace deploy key is
# reachable only from its main-only hardened publication job.
permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-images:
    name: Select image builds
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      ordinary_images: ${{ steps.select.outputs.ordinary_images }}
      codingworkspace_images: ${{ steps.select.outputs.codingworkspace_images }}
      validate_codingworkspace: ${{ steps.select.outputs.validate_codingworkspace }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select images
        id: select
        env:
          # pull_request has no event.before. Use its actual base commit rather
          # than falling back to a parent of GitHub's synthetic merge commit.
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_SCOPE: ${{ inputs.scope || 'changed' }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/image-selection"
          python3 codingworkspace-notebook/ci/select_images.py \
            --before "$BEFORE_SHA" \
            --current "$CURRENT_SHA" \
            --scope "$DISPATCH_SCOPE" \
            --format github-output > "$output_file"
          cat "$output_file"
          cat "$output_file" >> "$GITHUB_OUTPUT"

  validate-codingworkspace:
    name: Validate CodingWorkspace image
    needs: select-images
    if: needs.select-images.outputs.validate_codingworkspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate image configuration and CI policy
        run: codingworkspace-notebook/ci/validate-static.sh

  # Keep the repository's established build/push contract for the six images
  # not owned by CodingWorkspace: branch and tag pushes publish the short-SHA
  # candidate and move latest, without imposing CW's SBOM/Trivy release gate.
  build-and-push-ordinary:
    name: Build and push ${{ matrix.image }}
    needs: select-images
    if: >-
      needs.select-images.outputs.ordinary_images != '[]' &&
      github.repository == 'ubc/jupyter-images' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.ordinary_images) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push ordinary image
        run: |
          set -euo pipefail
          if [ -z "${ACCOUNT_ID:-}" ] || [ -z "${AWS_REGION:-}" ]; then
            echo "AWS_ACCOUNT_ID and AWS_REGION must be configured for publication." >&2
            exit 1
          fi
          registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          repository="$registry/$IMAGE_NAME"
          tag="${GITHUB_SHA::7}"
          # Creating the repository is best-effort. The publication role may be
          # able to push without holding ecr:DescribeRepositories, in which case
          # the describe fails even though the repository exists and the create
          # then fails with RepositoryAlreadyExistsException. Neither is fatal;
          # a genuinely missing repository still surfaces on the push below.
          if ! aws ecr describe-repositories --repository-names "$IMAGE_NAME" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$IMAGE_NAME" >/dev/null 2>&1 || true
          fi
          docker buildx build --load -f "$IMAGE_NAME/Dockerfile" -t "$repository:$tag" .
          docker push "$repository:$tag"
          docker tag "$repository:$tag" "$repository:latest"
          docker push "$repository:latest"

  build-scan-publish:
    name: Build and publish hardened ${{ matrix.image }}
    needs: [select-images, validate-codingworkspace]
    if: >-
      needs.select-images.outputs.codingworkspace_images != '[]' &&
      github.repository == 'ubc/jupyter-images' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    # Configure this environment to allow deployments only from main. Keep the
    # deploy key only at environment scope, and restrict the AWS OIDC role to
    # this repository's exact publication-environment subject. The environment
    # deployment rule is what binds that subject to main.
    environment: codingworkspace-publication
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.codingworkspace_images) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - name: Verify publication environment policy acknowledgement
        env:
          PUBLICATION_POLICY_ACK: ${{ vars.CODINGWORKSPACE_PUBLICATION_POLICY_ACK }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_POLICY_ACK" = main-only-no-admin-bypass-v1

      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate optional CodingWorkspace candidate request
        if: matrix.image == 'codingworkspace-notebook'
        env:
          REQUESTED_CW_CANDIDATE_SHA: ${{ inputs.codingworkspace_candidate_sha || '' }}
          PROMOTE_CODINGWORKSPACE: ${{ inputs.promote_codingworkspace || false }}
        run: |
          set -euo pipefail
          tracked_ref=$(python3 codingworkspace-notebook/ci/read_pin.py codingworkspace-notebook/CW_REF)
          build_ref=$(python3 codingworkspace-notebook/ci/select_cw_build_ref.py \
            --tracked-ref "$tracked_ref" \
            --candidate-sha "$REQUESTED_CW_CANDIDATE_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --promote-codingworkspace "$PROMOTE_CODINGWORKSPACE")
          candidate_override=false
          candidate_sha=""
          if [ -n "$REQUESTED_CW_CANDIDATE_SHA" ]; then
            candidate_override=true
            candidate_sha="$build_ref"
          fi
          printf 'CW_TRACKED_REF=%s\n' "$tracked_ref" >> "$GITHUB_ENV"
          printf 'CW_REF=%s\n' "$build_ref" >> "$GITHUB_ENV"
          printf 'CW_CANDIDATE_OVERRIDE=%s\n' "$candidate_override" >> "$GITHUB_ENV"
          printf 'CW_CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-codingworkspace-publication
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve exact CodingWorkspace and GizmoApp sources
        if: matrix.image == 'codingworkspace-notebook'
        env:
          CW_DEPLOY_KEY: ${{ secrets.CW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${CW_REF:-}"
          test -n "${CW_TRACKED_REF:-}"
          GIZMOAPP_REF=$(python3 codingworkspace-notebook/ci/read_pin.py codingworkspace-notebook/GIZMOAPP_REF)
          . codingworkspace-notebook/DEPENDENCY_LAYER.env
          if [ -z "${CW_DEPLOY_KEY:-}" ]; then
            echo "CW_DEPLOY_KEY is required for a trusted codingworkspace-notebook build." >&2
            exit 1
          fi

          keyfile="$RUNNER_TEMP/cw_deploy_key"
          known_hosts="$GITHUB_WORKSPACE/codingworkspace-notebook/ci/github_known_hosts"
          cwsrc="$RUNNER_TEMP/cw-src"
          gizmosrc="$RUNNER_TEMP/gizmo-src"
          sourcecontexts="$RUNNER_TEMP/cw-source-contexts"
          cwcontext="$sourcecontexts/cw"
          gizmocontext="$sourcecontexts/gizmo"
          buildercontext="$sourcecontexts/dependency-builder"
          cleanup() {
            rm -f "$keyfile"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$CW_DEPLOY_KEY" > "$keyfile"

          rm -rf "$cwsrc" "$gizmosrc" "$sourcecontexts"
          install -d -m 0700 "$sourcecontexts"
          GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes" \
            git clone --quiet --no-tags git@github.com:kevinlb1/CodingWorkspace.git "$cwsrc"
          test "$(git -C "$cwsrc" rev-parse --show-object-format)" = sha1
          git -C "$cwsrc" cat-file -e "${CW_REF}^{commit}"
          resolved_cw_ref=$(git -C "$cwsrc" rev-parse --verify "${CW_REF}^{commit}")
          test "$resolved_cw_ref" = "$CW_REF"
          if [ "${CW_CANDIDATE_OVERRIDE:-false}" = true ]; then
            test "${CW_CANDIDATE_SHA:-}" = "$CW_REF"
            # A manual candidate may test an unreleased main commit, but it
            # cannot use an unmerged side-branch or otherwise injected object.
            python3 codingworkspace-notebook/ci/verify_cw_candidate.py \
              "$cwsrc" "$CW_CANDIDATE_SHA"
          else
            test -z "${CW_CANDIDATE_SHA:-}"
          fi
          git -C "$cwsrc" checkout --quiet --detach "$CW_REF"
          test "$(git -C "$cwsrc" rev-parse HEAD)" = "$CW_REF"

          git clone --quiet --no-tags https://github.com/kevinlb1/GizmoApp.git "$gizmosrc"
          git -C "$gizmosrc" checkout --quiet --detach "$GIZMOAPP_REF"
          test "$(git -C "$gizmosrc" rev-parse HEAD)" = "$GIZMOAPP_REF"
          test "$(git -C "$gizmosrc" rev-parse --show-object-format)" = sha1

          # The docker-container Buildx driver does not reliably transfer a
          # local checkout's .git directory. Pass bundle-only contexts instead:
          # the image can still verify and archive the exact Git objects, while
          # checkout credentials and configuration never reach the builder.
          python3 codingworkspace-notebook/ci/prepare_git_context.py \
            "$cwsrc" "$CW_REF" "$cwcontext"
          python3 codingworkspace-notebook/ci/prepare_git_context.py \
            "$gizmosrc" "$GIZMOAPP_REF" "$gizmocontext"
          python3 codingworkspace-notebook/ci/prepare_git_blob_context.py \
            "$cwsrc" "$DEPENDENCY_BUILDER_REF" \
            scripts/build_dependency_wheelhouse.py \
            "$DEPENDENCY_BUILDER_BLOB" "$buildercontext"

          printf 'CW_REF=%s\n' "$CW_REF" >> "$GITHUB_ENV"
          printf 'GIZMOAPP_REF=%s\n' "$GIZMOAPP_REF" >> "$GITHUB_ENV"
          . codingworkspace-notebook/RUNTIME_PINS.env
          printf 'OPENCODE_VERSION=%s\n' "$OPENCODE_VERSION" >> "$GITHUB_ENV"
          printf 'CW_CONTEXT=%s\n' "$cwcontext" >> "$GITHUB_ENV"
          printf 'GIZMO_CONTEXT=%s\n' "$gizmocontext" >> "$GITHUB_ENV"
          printf 'CW_BUILDER_CONTEXT=%s\n' "$buildercontext" >> "$GITHUB_ENV"
          printf 'DEPENDENCY_WHEELHOUSE_LAYER_VERSION=%s\n' "$DEPENDENCY_WHEELHOUSE_LAYER_VERSION" >> "$GITHUB_ENV"
          printf 'DEPENDENCY_BUILDER_REF=%s\n' "$DEPENDENCY_BUILDER_REF" >> "$GITHUB_ENV"
          printf 'DEPENDENCY_BUILDER_BLOB=%s\n' "$DEPENDENCY_BUILDER_BLOB" >> "$GITHUB_ENV"
          printf 'DEPENDENCY_WHEEL_INDEX_URL=%s\n' "$DEPENDENCY_WHEEL_INDEX_URL" >> "$GITHUB_ENV"

      - name: Build exact amd64 dependency layer metadata
        id: dependency_layer
        if: matrix.image == 'codingworkspace-notebook'
        run: |
          set -euo pipefail
          dependency_export="$RUNNER_TEMP/dependency-wheelhouse-export"
          metadata_file="$RUNNER_TEMP/dependency-wheelhouse-metadata.env"
          rm -rf -- "$dependency_export" "$metadata_file"
          docker buildx build \
            --platform linux/amd64 \
            --target dependency-wheelhouse-evidence \
            --build-context "cwsrc=$CW_CONTEXT" \
            --build-context "gizmosrc=$GIZMO_CONTEXT" \
            --build-context "cwbuildersrc=$CW_BUILDER_CONTEXT" \
            --build-arg "CW_REF=$CW_REF" \
            --build-arg "GIZMOAPP_REF=$GIZMOAPP_REF" \
            --build-arg "OPENCODE_VERSION=$OPENCODE_VERSION" \
            --build-arg "DEPENDENCY_WHEELHOUSE_LAYER_VERSION=$DEPENDENCY_WHEELHOUSE_LAYER_VERSION" \
            --build-arg "DEPENDENCY_BUILDER_REF=$DEPENDENCY_BUILDER_REF" \
            --build-arg "DEPENDENCY_BUILDER_BLOB=$DEPENDENCY_BUILDER_BLOB" \
            --build-arg "DEPENDENCY_WHEEL_INDEX_URL=$DEPENDENCY_WHEEL_INDEX_URL" \
            --output "type=local,dest=$dependency_export" \
            -f codingworkspace-notebook/Dockerfile .
          manifest="$dependency_export/manifest.json"
          test -s "$manifest"
          python3 codingworkspace-notebook/ci/dependency_manifest_evidence.py \
            "$manifest" "$DEPENDENCY_WHEELHOUSE_LAYER_VERSION" \
            --format github-env > "$metadata_file"
          cat "$metadata_file" >> "$GITHUB_ENV"
          . "$metadata_file"
          test -n "$DEPENDENCY_RUNTIME_ID"
          test -n "$DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256"
          printf 'DEPENDENCY_MANIFEST_EXPORT=%s\n' "$manifest" >> "$GITHUB_ENV"
          printf 'CODINGWORKSPACE_IMAGE_PLATFORM=linux/amd64\n' >> "$GITHUB_ENV"

      - name: Prepare immutable image name
        run: |
          set -euo pipefail
          if [ -z "${ACCOUNT_ID:-}" ] || [ -z "${AWS_REGION:-}" ]; then
            echo "AWS_ACCOUNT_ID and AWS_REGION must be configured for trusted publication." >&2
            exit 1
          fi
          # ECR permits mutable tags. Make every candidate tag run-unique so a
          # rerun can never overwrite the artifact whose digest was reviewed.
          tag="${GITHUB_SHA::7}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          if [ "$IMAGE_NAME" = codingworkspace-notebook ]; then
            test -n "${CW_REF:-}"
            test -n "${GIZMOAPP_REF:-}"
            if [ "${CW_CANDIDATE_OVERRIDE:-false}" = true ]; then
              test "${CW_CANDIDATE_SHA:-}" = "$CW_REF"
              tag="${GITHUB_SHA::7}-cw${CW_CANDIDATE_SHA}-gz${GIZMOAPP_REF:0:7}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
            else
              test -z "${CW_CANDIDATE_SHA:-}"
              test "$CW_REF" = "${CW_TRACKED_REF:-}"
              tag="${GITHUB_SHA::7}-cw${CW_REF:0:7}-gz${GIZMOAPP_REF:0:7}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
            fi
          fi
          registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ecr_image="${registry}/${IMAGE_NAME}:${tag}"
          local_image="local/${IMAGE_NAME}:${GITHUB_SHA::7}"
          # The hardened publication role deliberately cannot discover or
          # create repositories. LTIC pre-provisions this exact repository;
          # a missing repository fails visibly on the push below.
          printf 'IMMUTABLE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          printf 'ECR_REPOSITORY=%s/%s\n' "$registry" "$IMAGE_NAME" >> "$GITHUB_ENV"
          printf 'ECR_IMAGE=%s\n' "$ecr_image" >> "$GITHUB_ENV"
          printf 'LOCAL_IMAGE=%s\n' "$local_image" >> "$GITHUB_ENV"

      - name: Build and publish immutable candidate with provenance and BuildKit SBOM
        id: publish_candidate
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/${IMAGE_NAME}-published-build-metadata.json"
          rm -f -- "$metadata_file"
          cleanup_build_metadata() {
            rm -f -- "$metadata_file"
          }
          trap cleanup_build_metadata EXIT
          build_args=(
            --push
            --platform linux/amd64
            --provenance=mode=max
            --sbom=true
            --metadata-file "$metadata_file"
            -f "$IMAGE_NAME/Dockerfile"
            -t "$ECR_IMAGE"
          )
          if [ "$IMAGE_NAME" = codingworkspace-notebook ]; then
            build_args+=(
              --build-context "cwsrc=$CW_CONTEXT"
              --build-context "gizmosrc=$GIZMO_CONTEXT"
              --build-context "cwbuildersrc=$CW_BUILDER_CONTEXT"
              --build-arg "CW_REF=$CW_REF"
              --build-arg "CW_CANDIDATE_SHA=${CW_CANDIDATE_SHA:-}"
              --build-arg "GIZMOAPP_REF=$GIZMOAPP_REF"
              --build-arg "OPENCODE_VERSION=$OPENCODE_VERSION"
              --build-arg "DEPENDENCY_WHEELHOUSE_LAYER_VERSION=$DEPENDENCY_WHEELHOUSE_LAYER_VERSION"
              --build-arg "DEPENDENCY_BUILDER_REF=$DEPENDENCY_BUILDER_REF"
              --build-arg "DEPENDENCY_BUILDER_BLOB=$DEPENDENCY_BUILDER_BLOB"
              --build-arg "DEPENDENCY_WHEEL_INDEX_URL=$DEPENDENCY_WHEEL_INDEX_URL"
              --build-arg "DEPENDENCY_RUNTIME_ID=$DEPENDENCY_RUNTIME_ID"
              --build-arg "DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256=$DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256"
            )
          fi
          docker buildx build "${build_args[@]}" .
          # Buildx records the digest it actually pushed. Reading that builder
          # result avoids a separate ECR DescribeImages control-plane lookup
          # and its IAM/consistency failure modes. The exact-digest pull below
          # remains the independent registry read-back before any smoke or scan.
          digest=$(python3 -c \
            'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("containerimage.digest", ""))' \
            "$metadata_file")
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Buildx did not record a valid published digest: $digest" >&2; exit 1 ;;
          esac
          # Every subsequent smoke/scan operates on the exact published digest.
          # A rejected candidate may remain addressable by its immutable tag but
          # is never promoted to a moving tag.
          printf 'IMAGE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          docker pull "$ECR_REPOSITORY@$digest"
          docker tag "$ECR_REPOSITORY@$digest" "$LOCAL_IMAGE"

      - name: Remove private source staging
        if: always() && matrix.image == 'codingworkspace-notebook'
        run: >-
          rm -rf -- "$RUNNER_TEMP/cw-src" "$RUNNER_TEMP/gizmo-src"
          "$RUNNER_TEMP/cw-source-contexts"

      - name: Run CodingWorkspace image contract smoke
        id: contract_smoke
        if: matrix.image == 'codingworkspace-notebook'
        run: >-
          codingworkspace-notebook/ci/smoke-image.sh
          contract "$LOCAL_IMAGE" "$CW_REF" "$GIZMOAPP_REF"

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Extract exact-digest dependency evidence
        id: dependency_exact_evidence
        if: matrix.image == 'codingworkspace-notebook'
        run: |
          set -euo pipefail
          container_id=$(docker create "$LOCAL_IMAGE")
          cleanup_container() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup_container EXIT
          docker cp \
            "$container_id:/opt/codingworkspace-dependency-wheelhouse/manifest.json" \
            evidence/codingworkspace-dependency-wheelhouse-manifest.json
          docker cp \
            "$container_id:/etc/codingworkspace-dependency-wheelhouse.env" \
            evidence/codingworkspace-dependency-wheelhouse-identity.env
          cleanup_container
          trap - EXIT
          cmp "$DEPENDENCY_MANIFEST_EXPORT" \
            evidence/codingworkspace-dependency-wheelhouse-manifest.json
          python3 codingworkspace-notebook/ci/dependency_manifest_evidence.py \
            evidence/codingworkspace-dependency-wheelhouse-manifest.json \
            "$DEPENDENCY_WHEELHOUSE_LAYER_VERSION" --format github-env \
            > "$RUNNER_TEMP/exact-dependency-metadata.env"
          expected_runtime_id=$DEPENDENCY_RUNTIME_ID
          expected_manifest_sha256=$DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256
          . "$RUNNER_TEMP/exact-dependency-metadata.env"
          test "$DEPENDENCY_RUNTIME_ID" = "$expected_runtime_id"
          test "$DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256" \
            = "$expected_manifest_sha256"
          grep -Fxq \
            "DEPENDENCY_WHEELHOUSE_LAYER_VERSION=${DEPENDENCY_WHEELHOUSE_LAYER_VERSION}" \
            evidence/codingworkspace-dependency-wheelhouse-identity.env
          grep -Fxq "DEPENDENCY_RUNTIME_ID=${DEPENDENCY_RUNTIME_ID}" \
            evidence/codingworkspace-dependency-wheelhouse-identity.env
          grep -Fxq \
            "DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256=${DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256}" \
            evidence/codingworkspace-dependency-wheelhouse-identity.env
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$LOCAL_IMAGE")" \
            = linux/amd64

      - name: Generate SPDX SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: evidence/${{ matrix.image }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          dependency-snapshot: false

      - name: Generate vulnerability report
        id: vulnerability_scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: evidence/${{ matrix.image }}-trivy.json
          version: v0.74.0
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

      # Keep the complete report above for review, but automatically reject a
      # candidate with any CRITICAL finding for which a fix is available.
      - name: Enforce fixable CRITICAL vulnerability policy
        id: vulnerability_gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: evidence/${{ matrix.image }}-trivy-fixable-critical.json
          version: v0.74.0
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Record release evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_run=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'jupyter_images_commit=%s\n' "$GITHUB_SHA"
            printf 'image=%s\n' "${ECR_IMAGE:-not-published}"
            printf 'digest=%s\n' "${IMAGE_DIGEST:-not-published}"
            printf 'codingworkspace_commit=%s\n' "${CW_REF:-not-applicable}"
            printf 'codingworkspace_tracked_commit=%s\n' "${CW_TRACKED_REF:-not-applicable}"
            printf 'codingworkspace_candidate_commit=%s\n' "${CW_CANDIDATE_SHA:-not-requested}"
            printf 'codingworkspace_candidate_override=%s\n' "${CW_CANDIDATE_OVERRIDE:-false}"
            printf 'gizmoapp_commit=%s\n' "${GIZMOAPP_REF:-not-applicable}"
            printf 'image_platform=%s\n' "${CODINGWORKSPACE_IMAGE_PLATFORM:-not-applicable}"
            printf 'dependency_builder_commit=%s\n' "${DEPENDENCY_BUILDER_REF:-not-applicable}"
            printf 'dependency_builder_blob=%s\n' "${DEPENDENCY_BUILDER_BLOB:-not-applicable}"
            printf 'dependency_wheel_index_url=%s\n' "${DEPENDENCY_WHEEL_INDEX_URL:-not-applicable}"
            printf 'dependency_layer_version=%s\n' "${DEPENDENCY_WHEELHOUSE_LAYER_VERSION:-not-applicable}"
            printf 'dependency_runtime_id=%s\n' "${DEPENDENCY_RUNTIME_ID:-not-applicable}"
            printf 'dependency_manifest_sha256=%s\n' "${DEPENDENCY_WHEELHOUSE_MANIFEST_SHA256:-not-applicable}"
            printf 'prepromotion_job_status=%s\n' "${{ job.status }}"
            printf 'immutable_publish_result=%s\n' "${{ steps.publish_candidate.outcome }}"
            printf 'contract_smoke_result=%s\n' "${{ steps.contract_smoke.outcome }}"
            printf 'dependency_layer_result=%s\n' "${{ steps.dependency_layer.outcome }}"
            printf 'dependency_exact_evidence_result=%s\n' "${{ steps.dependency_exact_evidence.outcome }}"
            printf 'sbom_result=%s\n' "${{ steps.sbom.outcome }}"
            printf 'vulnerability_scan_result=%s\n' "${{ steps.vulnerability_scan.outcome }}"
            printf 'vulnerability_gate_result=%s\n' "${{ steps.vulnerability_gate.outcome }}"
            printf 'codingworkspace_promotion_requested=%s\n' "${{ matrix.image == 'codingworkspace-notebook' && github.event_name == 'workflow_dispatch' && inputs.promote_codingworkspace == true }}"
            printf 'syft=v1.51.1\n'
            printf 'trivy=v0.74.0\n'
            printf 'actions_artifact_retention_days=90\n'
            printf 'independent_release_record_required_before_production=true\n'
          } > "evidence/${IMAGE_NAME}-release.txt"
          if [[ "${IMAGE_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]] \
             && [ -n "${ECR_REPOSITORY:-}" ]; then
            printf '%s@%s\n' "$ECR_REPOSITORY" "$IMAGE_DIGEST" \
              > evidence/published-image.txt
          fi
          (
            cd evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | LC_ALL=C sort -z \
              | xargs -0 --no-run-if-empty sha256sum > SHA256SUMS
          )

      - name: Upload build, SBOM, and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      # Evidence upload is itself a preview/latest gate. The 90-day artifact is
      # a transfer window; production separately requires checksum verification
      # and transfer into the course's independently backed-up release record.
      - name: Promote approved CodingWorkspace release
        id: promote_codingworkspace
        if: >-
          success() &&
          matrix.image == 'codingworkspace-notebook' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.promote_codingworkspace == true &&
          inputs.codingworkspace_candidate_sha == '' &&
          env.CW_CANDIDATE_OVERRIDE != 'true'
        run: |
          set -euo pipefail
          record_receipt_field() {
            local key="$1"
            local value="$2"
            case "$key" in
              *[!A-Z0-9_]*) echo "Invalid promotion receipt field: $key" >&2; return 1 ;;
            esac
            case "$value" in
              *$'\n'* | *$'\r'*) echo "Invalid multiline promotion receipt value" >&2; return 1 ;;
            esac
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          }
          digest_for_tag() {
            local manifest_json=""
            manifest_json=$(docker buildx imagetools inspect \
              "$ECR_REPOSITORY:$1" \
              --format '{{json .Manifest}}' 2>/dev/null || true)
            if [ -n "$manifest_json" ]; then
              python3 -c \
                'import json, sys; value = json.load(sys.stdin).get("digest", ""); print(value if isinstance(value, str) else "")' \
                <<<"$manifest_json" 2>/dev/null || true
            fi
          }
          move_and_verify() {
            local phase="$1"
            local tag="$2"
            local digest="$3"
            local observed=""
            local prefix=""
            case "$phase:$tag" in
              promotion:latest) prefix=PROMOTION_LATEST ;;
              promotion:preview) prefix=PROMOTION_PREVIEW ;;
              rollback:latest) prefix=ROLLBACK_LATEST ;;
              rollback:preview) prefix=ROLLBACK_PREVIEW ;;
              *) echo "Invalid promotion move phase/tag: $phase/$tag" >&2; return 1 ;;
            esac
            record_receipt_field "${prefix}_ATTEMPTED_DIGEST" "$digest"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$ECR_REPOSITORY:$tag" \
              "$ECR_REPOSITORY@$digest"
            for attempt in $(seq 1 12); do
              observed=$(digest_for_tag "$tag")
              if [ "$observed" = "$digest" ]; then
                record_receipt_field "${prefix}_READBACK_DIGEST" "$observed"
                return 0
              fi
              sleep 5
            done
            record_receipt_field "${prefix}_READBACK_DIGEST" "${observed:-not-observed}"
            echo "$tag resolved to $observed, expected $digest" >&2
            return 1
          }

          rollback_armed=false
          previous_latest=not-observed
          previous_preview=not-observed
          finalize_promotion() {
            local status=$?
            local final_latest=""
            local final_preview=""
            local outcome=""
            trap - EXIT
            set +e

            final_latest=$(digest_for_tag latest)
            final_preview=$(digest_for_tag preview)
            if [ "$status" -eq 0 ] && {
              [ "$final_latest" != "$IMAGE_DIGEST" ] ||
              [ "$final_preview" != "$IMAGE_DIGEST" ];
            }; then
              echo "Final promotion readback did not retain the tested digest." >&2
              status=1
            fi

            if [ "$status" -ne 0 ] && [ "$rollback_armed" = true ]; then
              echo "Promotion failed; restoring previous moving-tag digests." >&2
              move_and_verify rollback latest "$previous_latest" || true
              move_and_verify rollback preview "$previous_preview" || true
              final_latest=$(digest_for_tag latest)
              final_preview=$(digest_for_tag preview)
              if [ "$final_latest" = "$previous_latest" ] && \
                 [ "$final_preview" = "$previous_preview" ]; then
                outcome=failed_rolled_back
              else
                outcome=failed_rollback_incomplete
              fi
            elif [ "$status" -eq 0 ]; then
              outcome=promoted
            else
              outcome=failed_before_tag_moves
            fi

            if [ "$status" -ne 0 ]; then
              record_receipt_field CODINGWORKSPACE_LATEST_MOVED false
              record_receipt_field CODINGWORKSPACE_PREVIEW_MOVED false
            fi
            record_receipt_field PROMOTION_FINAL_LATEST_DIGEST "${final_latest:-not-observed}"
            record_receipt_field PROMOTION_FINAL_PREVIEW_DIGEST "${final_preview:-not-observed}"
            record_receipt_field PROMOTION_OUTCOME "$outcome"
            record_receipt_field PROMOTION_STEP_EXIT_STATUS "$status"
            exit "$status"
          }
          trap finalize_promotion EXIT

          record_receipt_field PROMOTION_RECEIPT_STARTED true
          record_receipt_field PROMOTION_TESTED_DIGEST "$IMAGE_DIGEST"
          record_receipt_field PROMOTION_OUTCOME started
          record_receipt_field CODINGWORKSPACE_LATEST_MOVED false
          record_receipt_field CODINGWORKSPACE_PREVIEW_MOVED false

          previous_latest=$(digest_for_tag latest)
          previous_preview=$(digest_for_tag preview)
          record_receipt_field PROMOTION_PREVIOUS_LATEST_DIGEST "${previous_latest:-not-observed}"
          record_receipt_field PROMOTION_PREVIOUS_PREVIEW_DIGEST "${previous_preview:-not-observed}"
          case "$previous_latest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "latest has no rollback-safe immutable digest: $previous_latest" >&2; exit 1 ;;
          esac
          case "$previous_preview" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "preview has no rollback-safe immutable digest: $previous_preview" >&2; exit 1 ;;
          esac
          rollback_armed=true

          move_and_verify promotion latest "$IMAGE_DIGEST"
          record_receipt_field CODINGWORKSPACE_LATEST_MOVED true

          # Preview is the Hub-consumed moving tag, so update it last and only
          # after latest has been observed at the tested digest.
          move_and_verify promotion preview "$IMAGE_DIGEST"
          record_receipt_field CODINGWORKSPACE_PREVIEW_MOVED true

      - name: Record CodingWorkspace promotion receipt
        if: >-
          always() &&
          matrix.image == 'codingworkspace-notebook' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.promote_codingworkspace == true &&
          inputs.codingworkspace_candidate_sha == '' &&
          env.CW_CANDIDATE_OVERRIDE != 'true' &&
          env.PROMOTION_RECEIPT_STARTED == 'true'
        run: |
          set -euo pipefail
          install -d -m 0700 promotion-receipt
          {
            printf 'receipt_version=1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'workflow_run=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'jupyter_images_commit=%s\n' "$GITHUB_SHA"
            printf 'codingworkspace_commit=%s\n' "$CW_REF"
            printf 'codingworkspace_tracked_commit=%s\n' "$CW_TRACKED_REF"
            printf 'gizmoapp_commit=%s\n' "$GIZMOAPP_REF"
            printf 'image_repository=%s\n' "$ECR_REPOSITORY"
            printf 'immutable_tag=%s\n' "$IMMUTABLE_TAG"
            printf 'tested_digest=%s\n' "$PROMOTION_TESTED_DIGEST"
            printf 'previous_latest_digest=%s\n' "${PROMOTION_PREVIOUS_LATEST_DIGEST:-not-recorded}"
            printf 'previous_preview_digest=%s\n' "${PROMOTION_PREVIOUS_PREVIEW_DIGEST:-not-recorded}"
            printf 'promotion_latest_attempted_digest=%s\n' "${PROMOTION_LATEST_ATTEMPTED_DIGEST:-not-attempted}"
            printf 'promotion_latest_readback_digest=%s\n' "${PROMOTION_LATEST_READBACK_DIGEST:-not-observed}"
            printf 'promotion_preview_attempted_digest=%s\n' "${PROMOTION_PREVIEW_ATTEMPTED_DIGEST:-not-attempted}"
            printf 'promotion_preview_readback_digest=%s\n' "${PROMOTION_PREVIEW_READBACK_DIGEST:-not-observed}"
            printf 'rollback_latest_attempted_digest=%s\n' "${ROLLBACK_LATEST_ATTEMPTED_DIGEST:-not-attempted}"
            printf 'rollback_latest_readback_digest=%s\n' "${ROLLBACK_LATEST_READBACK_DIGEST:-not-observed}"
            printf 'rollback_preview_attempted_digest=%s\n' "${ROLLBACK_PREVIEW_ATTEMPTED_DIGEST:-not-attempted}"
            printf 'rollback_preview_readback_digest=%s\n' "${ROLLBACK_PREVIEW_READBACK_DIGEST:-not-observed}"
            printf 'final_latest_digest=%s\n' "${PROMOTION_FINAL_LATEST_DIGEST:-not-observed}"
            printf 'final_preview_digest=%s\n' "${PROMOTION_FINAL_PREVIEW_DIGEST:-not-observed}"
            printf 'outcome=%s\n' "${PROMOTION_OUTCOME:-unknown}"
            printf 'promotion_step_exit_status=%s\n' "${PROMOTION_STEP_EXIT_STATUS:-unknown}"
            printf 'promotion_step_result=%s\n' "${{ steps.promote_codingworkspace.outcome }}"
            printf 'actions_artifact_retention_days=90\n'
          } > promotion-receipt/codingworkspace-promotion.txt
          (
            cd promotion-receipt
            sha256sum codingworkspace-promotion.txt > SHA256SUMS
          )

      - name: Upload CodingWorkspace promotion receipt
        if: >-
          always() &&
          matrix.image == 'codingworkspace-notebook' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.promote_codingworkspace == true &&
          inputs.codingworkspace_candidate_sha == '' &&
          env.CW_CANDIDATE_OVERRIDE != 'true' &&
          env.PROMOTION_RECEIPT_STARTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codingworkspace-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-promotion-receipt
          path: promotion-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize verified moving tags
        if: always()
        # The authoritative checks are the promotion step's ECR read-backs and
        # the already-uploaded candidate evidence. A UI-summary write must not
        # turn a completed live tag move into a misleading failed release.
        continue-on-error: true
        run: |
          {
            printf '### Registry promotion result\n\n'
            printf -- '- Tested digest: `%s`\n' "${IMAGE_DIGEST:-not-published}"
            printf -- '- CodingWorkspace latest verified: `%s`\n' "${CODINGWORKSPACE_LATEST_MOVED:-false}"
            printf -- '- CodingWorkspace preview verified: `%s`\n' "${CODINGWORKSPACE_PREVIEW_MOVED:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
