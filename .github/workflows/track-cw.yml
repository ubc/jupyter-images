name: Track CodingWorkspace release

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# This trusted workflow is the only automatic path that moves the
# codingworkspace-notebook :preview and :latest tags. A normal image-source
# merge may publish an immutable candidate but cannot alter the Hub target.
permissions: {}

concurrency:
  group: track-cw
  cancel-in-progress: false

jobs:
  bump:
    # workflow_dispatch can select a ref. Never grant the source/deployment
    # secret or a write token to a workflow definition outside reviewed main.
    if: >-
      github.repository == 'ubc/jupyter-images' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: codingworkspace-publication
    permissions:
      contents: write
      actions: write
    env:
      JI_BRANCH: main
      CW_REPO: git@github.com:kevinlb1/CodingWorkspace.git
      CW_BRANCH: release
      CW_REF_FILE: codingworkspace-notebook/CW_REF
    steps:
      - name: Verify publication environment policy acknowledgement
        env:
          PUBLICATION_POLICY_ACK: ${{ vars.CODINGWORKSPACE_PUBLICATION_POLICY_ACK }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_POLICY_ACK" = main-only-v1

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Resolve exact CodingWorkspace release head
        id: cw
        env:
          CW_DEPLOY_KEY: ${{ secrets.CW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CW_DEPLOY_KEY:-}" ]; then
            echo "CW_DEPLOY_KEY is required by the trusted release tracker." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/cw_key"
          known_hosts="$GITHUB_WORKSPACE/codingworkspace-notebook/ci/github_known_hosts"
          cleanup() {
            rm -f "$keyfile"
          }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$CW_DEPLOY_KEY" > "$keyfile"
          head=$(GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes" \
            git ls-remote "$CW_REPO" "refs/heads/$CW_BRANCH" | cut -f1)
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No full-SHA $CW_BRANCH head was returned by CodingWorkspace." >&2
            exit 1
          fi
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Bump CW_REF when release moved
        id: bump
        env:
          NEW_REF: ${{ steps.cw.outputs.head }}
        run: |
          set -euo pipefail
          current=$(python3 codingworkspace-notebook/ci/read_pin.py "$CW_REF_FILE")
          if [ "$current" = "$NEW_REF" ]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            echo "CW_REF already at $NEW_REF."
            exit 0
          fi
          python3 codingworkspace-notebook/ci/update_pin.py "$CW_REF_FILE" "$NEW_REF"
          test "$(python3 codingworkspace-notebook/ci/read_pin.py "$CW_REF_FILE")" = "$NEW_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CW_REF_FILE"
          git commit -m "auto: track CodingWorkspace $CW_BRANCH @ ${NEW_REF:0:7}"
          git push origin "HEAD:$JI_BRANCH"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Build and promote the approved release
        if: steps.bump.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$JI_BRANCH" \
            -f publish=true \
            -f scope=codingworkspace-notebook \
            -f promote_codingworkspace=true
          echo "Dispatched immutable build plus explicit preview/latest promotion."
